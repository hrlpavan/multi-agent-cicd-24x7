name: 24x7 Multi-Agent CI/CD Pipeline

on:
  push:
    branches: [ main, master, "**" ]
  pull_request:

jobs:
  validate_and_triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Multi-Agent Triage Orchestrator (Gemini 3.8 Flash + Claude Opus 4.8)
        run: python3 triage_orchestrator.py --self-check
      - name: Generate Sample Handoff Packet on Backend Failure
        if: failure()
        run: python3 triage_orchestrator.py
